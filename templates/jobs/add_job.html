{% extends 'base.html' %}

{% block title %}
Post New Job | TEAM GCC Valapattanam Connect
{% endblock %}

{% block content %}

<div class="container mt-5 mb-5">

    <div class="text-center mb-5">

        <h1 class="fw-bold">
            💼 Post a New Job
        </h1>

        <p class="text-muted">
            Add a new job opportunity for GCC members
        </p>

    </div>


    <div class="card shadow-sm mx-auto" style="max-width: 800px;">

        <div class="card-body p-4">

            <form method="POST">

                {% csrf_token %}


                <!-- Job Title -->

                <div class="mb-3">

                    <label class="form-label">
                        Job Title
                    </label>

                    <input
                        type="text"
                        name="job_title"
                        class="form-control"
                        placeholder="Example: Software Engineer"
                        required
                    >

                </div>


                <!-- Company -->

                <div class="mb-3">

                    <label class="form-label">
                        Company
                    </label>

                    <input
                        type="text"
                        name="company"
                        class="form-control"
                        placeholder="Company name"
                        required
                    >

                </div>


                <!-- Location -->

                <div class="mb-3">

                    <label class="form-label">
                        Location
                    </label>

                    <input
                        type="text"
                        name="location"
                        class="form-control"
                        placeholder="Example: Dubai, UAE"
                        required
                    >

                </div>


                <!-- Job Description -->

                <div class="mb-3">

                    <label class="form-label">
                        Job Description
                    </label>

                    <textarea
                        name="job_description"
                        class="form-control"
                        rows="6"
                        placeholder="Describe the job, requirements, responsibilities, etc."
                        required
                    ></textarea>

                </div>


                <!-- Contact -->

                <div class="mb-3">

                    <label class="form-label">
                        Contact Email / Phone
                    </label>

                    <input
                        type="text"
                        name="contact_email_phone"
                        class="form-control"
                        placeholder="Email address or phone number"
                        required
                    >

                </div>


                <!-- Status -->

                <div class="mb-4">

                    <label class="form-label">
                        Status
                    </label>

                    <select
                        name="status"
                        class="form-select"
                        required
                    >

                        <option value="Open">
                            Open
                        </option>

                        <option value="Closed">
                            Closed
                        </option>

                    </select>

                </div>


                <div class="text-center">

                    <button
                        type="submit"
                        class="btn btn-success me-2"
                    >
                        📢 Publish Job
                    </button>

                    <a
                        href="/admin-dashboard/"
                        class="btn btn-outline-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
